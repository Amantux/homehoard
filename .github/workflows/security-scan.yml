name: Security scan

# Advisory quality/security gates. Kept separate from CI/CD so an upstream CVE
# or a scanner hiccup never blocks the auto-release pipeline; results surface in
# the repo's Security tab (SARIF) and as job status on PRs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1" # weekly, Monday 06:27 UTC — catch newly-disclosed CVEs

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          language: ${{ matrix.language }}
          # Query suite + path exclusions live in the config file, with the
          # reasoning for each narrowing recorded alongside them.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"

  python-deps:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Advisory: report known-vulnerable Python deps without blocking releases.
      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc

  npm-deps:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: npm audit (high+)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review (PRs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  trivy-fs:
    name: Trivy filesystem + config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy
        run: |
          # Retry the download: this is a third-party CDN, and a transient 302 or
          # 5xx here means "the tool could not run", which is not a security
          # finding and must not fail the job. The SBOM job went red exactly
          # this way. The SCAN below still fails on a real finding.
          for attempt in 1 2 3; do
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b /usr/local/bin && exit 0
            echo "trivy install attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::warning::could not install Trivy after 3 attempts — skipping the scan"
          exit 0
      - name: Scan repo (vulns, misconfig, secrets) → SARIF
        run: |
          # If the install gave up, skip rather than fail on a missing binary:
          # otherwise the retry above just moves the red one step to the right.
          if ! command -v trivy >/dev/null; then
            echo "::warning::Trivy is not installed — scan skipped"
            exit 0
          fi
          trivy fs --scanners vuln,misconfig,secret \
            --format sarif --output trivy.sarif \
            --severity HIGH,CRITICAL --exit-code 0 .
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install & run gitleaks
        run: |
          # Retry the download only. A transient CDN failure is not a secret
          # leak; the scan itself still fails the job when it finds one.
          for attempt in 1 2 3; do
            curl -sfL -o gitleaks.tar.gz \
              https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz && break
            echo "gitleaks download attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          if [ ! -s gitleaks.tar.gz ]; then
            echo "::warning::could not download gitleaks — scan skipped"
            exit 0
          fi
          tar -xzf gitleaks.tar.gz gitleaks
          # Blocking on purpose: a committed credential is a defect in THIS diff
          # and is actionable immediately, unlike an upstream CVE or an outage.
          ./gitleaks detect --source . --redact --verbose

  sbom:
    name: SBOM (SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Advisory: this job PRODUCES an artifact, it cannot report a finding.
      # It failed once because syft's release download returned a 302 — a
      # third-party CDN hiccup must not turn the Security tab red.
      - continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: homehoard-sbom.spdx.json
