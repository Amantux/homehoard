name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Cancel superseded runs on the same PR; never cancel a push to the default
  # branch (protects the version bump + image build/publish from interruption).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default: test/build jobs install third-party dependencies,
# so they must NOT inherit a token that can push commits or images. The jobs
# that genuinely need write scopes elevate them individually below.
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run pytest
        working-directory: backend
        run: pytest -q

  config:
    name: Configuration contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Settings + precedence tests
        working-directory: backend
        run: pytest tests/test_config_contract.py -q
      - name: Generated config docs are in sync with the code
        run: python3 tools/gen_config_docs.py --check
      - name: Every setting is documented, and every setting used is declared
        # Bidirectional: a field missing from the docs AND a HBOX_* read in code
        # that nobody declared are both failures. This is what stops the registry
        # from quietly drifting back into scattered os.environ.get calls.
        run: |
          python3 - <<'CONTRACT'
          import os, re, sys
          sys.path.insert(0, "backend")
          from app.settings import FIELDS

          declared = {f.env_var for f in FIELDS}
          problems = []

          for doc in (".env.example", "docs/configuration.md"):
              text = open(doc).read()
              problems += [f"{v} is not documented in {doc}"
                           for v in sorted(declared) if v not in text]

          used = set()
          roots = ["backend/app", "backend/mcp_server.py",
                   "backend/ha_discovery.py", "backend/run.py"]
          for root in roots:
              paths = [root] if os.path.isfile(root) else [
                  os.path.join(d, f) for d, _, fs in os.walk(root)
                  for f in fs if f.endswith(".py")]
              for path in paths:
                  for m in re.findall(r"HBOX_[A-Z0-9_]+", open(path).read()):
                      used.add(m[:-5] if m.endswith("_FILE") else m)

          problems += [f"{v} is used in code but not declared in FIELDS"
                       for v in sorted(used - declared)]

          if problems:
              print("Configuration contract violations:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print(f"Configuration contract OK: {len(declared)} declared, "
                f"{len(used)} referenced, all documented.")
          CONTRACT
      - name: Invalid configuration is actually rejected
        # Mutation-style: if config_check stopped validating, these would pass
        # silently and the gate in docker-entrypoint.sh would be decorative.
        working-directory: backend
        run: |
          set -e
          fail() { echo "EXPECTED REJECTION: $1"; exit 1; }
          HBOX_DISABLE_AUTH=maybe python3 -m app.config_check --ha-options /nonexistent \
            && fail "HBOX_DISABLE_AUTH=maybe" || true
          HBOX_PORT=99999 python3 -m app.config_check --ha-options /nonexistent \
            && fail "HBOX_PORT out of range" || true
          HBOX_CORS_ORIGINS='*' python3 -m app.config_check --ha-options /nonexistent \
            && fail "wildcard CORS origin" || true
          HBOX_SECRET_KEY=change-me-in-production python3 -m app.config_check --ha-options /nonexistent \
            && fail "placeholder secret with auth enabled" || true
          python3 -m app.config_check --ha-options /nonexistent > /dev/null \
            || fail "a VALID configuration was rejected"
          echo "All invalid configurations were rejected; the valid one was accepted."

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  validate-addon:
    name: Validate add-on + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate config.yaml / manifest.json / repository.yaml
        run: |
          pip install pyyaml
          python3 - <<'PY'
          import json, yaml, sys
          cfg = yaml.safe_load(open("homehoard/config.yaml"))
          for f in ("name", "version", "slug", "image", "arch"):
              assert f in cfg, f"config.yaml missing {f}"
          man = json.load(open("custom_components/homehoard/manifest.json"))
          assert man["domain"] == "homehoard"
          # add-on version and integration version must stay in lockstep
          assert str(cfg["version"]) == str(man["version"]), (
              f"version mismatch: config={cfg['version']} manifest={man['version']}"
          )
          yaml.safe_load(open("repository.yaml"))
          print("add-on config OK, version", cfg["version"])
          PY

  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Ruff (backend)
        run: |
          pip install "ruff==0.15.12"
          ruff check backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ESLint (frontend)
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  smoke:
    name: Container smoke (build → readiness → shutdown)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build production image (amd64, load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: homehoard:ci
      - name: Start stack and wait for READINESS (not just process start)
        run: |
          set -euo pipefail
          docker run -d --name hh-ci -p 7745:7745 \
            -e HBOX_SECRET_KEY="$(openssl rand -base64 48)" homehoard:ci
          ok=""
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:7745/api/v1/ready >/dev/null 2>&1; then
              echo "ready after ${i} attempt(s)"; ok=1; break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "NEVER BECAME READY"; docker logs hh-ci; exit 1; fi
      - name: Smoke tests (liveness, readiness body, MCP process, non-root)
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:7745/api/v1/status | tee smoke-status.json
          echo; curl -fsS http://127.0.0.1:7745/api/v1/ready | tee smoke-ready.json
          echo
          # Every SERVER process must be non-root (uid 1000). pid 1 is now the
          # supervising shell, which stays root on purpose so it can chown the
          # Supervisor-managed /data and forward signals — so assert on the
          # children (gunicorn, mcp_server), not on pid 1.
          # Gate on /proc/*/comm, not the cmdline: a cmdline match would also
          # match this very scanning shell (its own command text contains the
          # pattern) and report a spurious root process.
          servers=$(docker exec hh-ci sh -c 'for d in /proc/[0-9]*; do
              comm=$(cat $d/comm 2>/dev/null)
              case "$comm" in
                gunicorn) ;;
                python3) tr "\0" " " < $d/cmdline 2>/dev/null | grep -q mcp_server || continue ;;
                *) continue ;;
              esac
              awk "/^Uid:/{print \$2}" $d/status 2>/dev/null
            done' | sort -u)
          echo "server uids: $servers"
          test -n "$servers"           # something must be running
          test "$servers" = "1000"     # sort -u collapses to exactly one value
          # MCP server must be listening on 7766 inside the container.
          docker exec hh-ci python3 -c "import socket;s=socket.socket();s.settimeout(3);s.connect(('127.0.0.1',7766));print('mcp listening')"
      - name: Clean shutdown within grace period
        run: |
          set -euo pipefail
          docker stop -t 15 hh-ci
          rc=$(docker inspect -f '{{.State.ExitCode}}' hh-ci)
          echo "exit code: $rc"
          # gunicorn exits 0 on a graceful SIGTERM; 137 = SIGKILL after the grace
          # period (ignored SIGTERM). Fail the gate on a non-graceful shutdown.
          test "$rc" = "0"
      - name: Container logs (on failure)
        if: failure()
        run: docker logs hh-ci || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-logs
          path: smoke-*.json
          if-no-files-found: ignore

  integration-tests:
    name: HA integration (services)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Runs the companion integration's service tests in a real Home Assistant
    # env (py3.13). These cover the confidence-tiering guards — an ambiguous
    # name must not check the wrong item out, and the spoken clarification must
    # name where each candidate lives — which nothing in the backend suite
    # exercises.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install harness
        run: |
          python -m pip install --upgrade pip
          pip install -r custom_components/homehoard/tests/requirements_test.txt
      - name: Run integration tests
        # asyncio_mode=auto: the async test fns have no per-test marker. sys.path
        # is fixed in the tests' conftest so `custom_components.homehoard` imports.
        run: pytest custom_components/homehoard/tests -q -o asyncio_mode=auto

  # Auto-bump the patch version on every push to main (skips its own commit).
  bump-version:
    name: Auto-bump patch version
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the version-bump commit
    if: >
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    needs: [backend-tests, frontend-build, validate-addon, lint, smoke, integration-tests]
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bump_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Bump patch version in config.yaml + manifest.json
        id: bump
        run: |
          python3 - <<'PY'
          import json, re, os

          cfg_path = "homehoard/config.yaml"
          man_path = "custom_components/homehoard/manifest.json"

          text = open(cfg_path).read()
          m = re.search(r'^version:\s*"?([0-9]+\.[0-9]+\.[0-9]+)"?', text, re.M)
          old = m.group(1)
          parts = old.split("."); parts[-1] = str(int(parts[-1]) + 1)
          new = ".".join(parts)

          text = re.sub(r'^(version:\s*).*$', f'\\1"{new}"', text, count=1, flags=re.M)
          open(cfg_path, "w").write(text)

          man = json.load(open(man_path))
          man["version"] = new
          with open(man_path, "w") as f:
              json.dump(man, f, indent=2); f.write("\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"old_version={old}\nnew_version={new}\n")
          print(f"Bumped {old} -> {new}")
          PY
      - name: Commit version bump
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add homehoard/config.yaml custom_components/homehoard/manifest.json
          git commit -m "chore: bump version ${{ steps.bump.outputs.old_version }} → ${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:${{ github.ref_name }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Build each architecture on a NATIVE runner (no QEMU). QEMU-emulated arm64
  # builds of the Node+Python image were so slow they hit the 6-hour job limit
  # and got cancelled. ubuntu-24.04-arm is a free native arm64 runner for public
  # repos, so both arches build in minutes.
  docker-build:
    permissions:
      contents: read
      packages: write   # pushes per-arch images to GHCR
    name: Build & push (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    if: >
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    needs: [bump-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push per-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # Per-arch tags; merged into a multi-arch manifest by the next job.
          tags: |
            ghcr.io/amantux/homehoard:${{ needs.bump-version.outputs.new_version }}-${{ matrix.arch }}
            ghcr.io/amantux/homehoard:latest-${{ matrix.arch }}

  merge-manifest:
    permissions:
      contents: read
      packages: write   # pushes the multi-arch manifest to GHCR
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    needs: [bump-version, docker-build]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifests
        run: |
          V=${{ needs.bump-version.outputs.new_version }}
          docker buildx imagetools create \
            --tag ghcr.io/amantux/homehoard:${V} \
            --tag ghcr.io/amantux/homehoard:latest \
            ghcr.io/amantux/homehoard:${V}-amd64 \
            ghcr.io/amantux/homehoard:${V}-arm64
          echo "Published ghcr.io/amantux/homehoard:${V} (amd64 + arm64)"

  # Cut a GitHub Release/tag per version so HACS surfaces clean update prompts.
  # Tags the bump commit (whose manifest.json already holds the new version) and
  # only runs once the image is published, so a release always has a matching
  # ghcr image + integration source.
  release:
    permissions:
      contents: write   # creates the GitHub release
    name: GitHub release (HACS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    needs: [bump-version, merge-manifest]
    steps:
      - name: Create release v${{ needs.bump-version.outputs.new_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.bump-version.outputs.new_version }}
          SHA: ${{ needs.bump-version.outputs.bump_sha }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "v${V}" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release v${V} already exists — skipping."
          else
            gh release create "v${V}" \
              --repo "$REPO" \
              --target "$SHA" \
              --title "v${V}" \
              --notes "HomeHoard ${V} — Home Assistant add-on & HACS integration. Container image: ghcr.io/amantux/homehoard:${V}"
            echo "Created release v${V} at ${SHA}"
          fi
