name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Cancel superseded runs on the same PR; never cancel a push to the default
  # branch (protects the version bump + image build/publish from interruption).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default: test/build jobs install third-party dependencies,
# so they must NOT inherit a token that can push commits or images. The jobs
# that genuinely need write scopes elevate them individually below.
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"  # match the runtime image (Dockerfile: python:3.14-slim)
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run pytest
        working-directory: backend
        run: pytest -q

  config:
    name: Configuration contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"  # match the runtime image (Dockerfile: python:3.14-slim)
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Settings + precedence tests
        working-directory: backend
        run: pytest tests/test_config_contract.py -q
      - name: Generated config docs are in sync with the code
        run: python3 tools/gen_config_docs.py --check
      - name: Every setting is documented, and every setting used is declared
        # Bidirectional: a field missing from the docs AND a HBOX_* read in code
        # that nobody declared are both failures. This is what stops the registry
        # from quietly drifting back into scattered os.environ.get calls.
        run: |
          python3 - <<'CONTRACT'
          import os, re, sys
          sys.path.insert(0, "backend")
          from app.settings import FIELDS

          declared = {f.env_var for f in FIELDS}
          problems = []

          for doc in (".env.example", "docs/configuration.md"):
              text = open(doc).read()
              problems += [f"{v} is not documented in {doc}"
                           for v in sorted(declared) if v not in text]

          used = set()
          roots = ["backend/app", "backend/mcp_server.py",
                   "backend/ha_discovery.py", "backend/run.py"]
          for root in roots:
              paths = [root] if os.path.isfile(root) else [
                  os.path.join(d, f) for d, _, fs in os.walk(root)
                  for f in fs if f.endswith(".py")]
              for path in paths:
                  for m in re.findall(r"HBOX_[A-Z0-9_]+", open(path).read()):
                      used.add(m[:-5] if m.endswith("_FILE") else m)

          problems += [f"{v} is used in code but not declared in FIELDS"
                       for v in sorted(used - declared)]

          if problems:
              print("Configuration contract violations:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print(f"Configuration contract OK: {len(declared)} declared, "
                f"{len(used)} referenced, all documented.")
          CONTRACT
      - name: Invalid configuration is actually rejected
        # Mutation-style: if config_check stopped validating, these would pass
        # silently and the gate in docker-entrypoint.sh would be decorative.
        working-directory: backend
        run: |
          set -e
          fail() { echo "EXPECTED REJECTION: $1"; exit 1; }
          HBOX_DISABLE_AUTH=maybe python3 -m app.config_check --ha-options /nonexistent \
            && fail "HBOX_DISABLE_AUTH=maybe" || true
          HBOX_PORT=99999 python3 -m app.config_check --ha-options /nonexistent \
            && fail "HBOX_PORT out of range" || true
          HBOX_CORS_ORIGINS='*' python3 -m app.config_check --ha-options /nonexistent \
            && fail "wildcard CORS origin" || true
          HBOX_SECRET_KEY=change-me-in-production python3 -m app.config_check --ha-options /nonexistent \
            && fail "placeholder secret with auth enabled" || true
          python3 -m app.config_check --ha-options /nonexistent > /dev/null \
            || fail "a VALID configuration was rejected"
          echo "All invalid configurations were rejected; the valid one was accepted."

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  validate-addon:
    name: Validate add-on + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate config.yaml / manifest.json / repository.yaml
        run: |
          pip install pyyaml
          python3 - <<'PY'
          import json, yaml, sys
          cfg = yaml.safe_load(open("homehoard/config.yaml"))
          for f in ("name", "version", "slug", "image", "arch"):
              assert f in cfg, f"config.yaml missing {f}"
          man = json.load(open("custom_components/homehoard/manifest.json"))
          assert man["domain"] == "homehoard"
          # add-on version and integration version must stay in lockstep
          assert str(cfg["version"]) == str(man["version"]), (
              f"version mismatch: config={cfg['version']} manifest={man['version']}"
          )
          yaml.safe_load(open("repository.yaml"))
          print("add-on config OK, version", cfg["version"])
          PY

  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Ruff (backend)
        run: |
          pip install "ruff==0.15.12"
          ruff check backend
      - name: Ruff advisory tier (never fails)
        # Warn-only rules surfaced as PR annotations; see the header of ruff.toml.
        # Promote a rule into ruff.toml's blocking `select` only after its
        # backlog is fixed in its own commit.
        run: ruff check --select BLE,S608,DTZ --exit-zero --output-format=github backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ESLint (frontend)
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  changelog:
    # A PR that changes what users run must say so under "## Unreleased" in
    # homehoard/CHANGELOG.md; bump-version promotes that heading to the release.
    # Dependency-manifest-only changes (Dependabot) are exempt; refactor/test
    # PRs that touch shipped paths opt out with the `skip-changelog` label
    # (added after the PR opened? re-run this job to pick it up).
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: List changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --name-only "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/changed.txt"
      - name: Require an Unreleased entry
        env:
          CHANGED_LIST: ${{ runner.temp }}/changed.txt
          CHANGELOG: homehoard/CHANGELOG.md
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          set -eu
          if [ "$SKIP_LABEL" = "true" ]; then
            echo "skip-changelog label set; not checking."; exit 0
          fi
          # Shipped paths, minus dependency manifests (one bot PR per bump).
          shipped=$(grep -E '^(backend/|frontend/|custom_components/|docker-entrypoint\.sh$|Dockerfile$)' "$CHANGED_LIST" \
            | grep -vE '(^|/)(requirements[^/]*\.txt|package\.json|package-lock\.json)$' || true)
          if [ -z "$shipped" ]; then
            echo "No shipped paths changed; no changelog entry needed."; exit 0
          fi
          echo "Shipped paths changed:"; echo "$shipped" | sed 's/^/  /'
          if ! grep -qxF "$CHANGELOG" "$CHANGED_LIST"; then
            echo "::error file=$CHANGELOG::This PR changes shipped code but not $CHANGELOG. Add a user-facing bullet under '## Unreleased' (or label the PR skip-changelog)."
            exit 1
          fi
          # Non-blank lines between "## Unreleased" and the next "## " heading.
          body=$(awk '/^## Unreleased[ \t]*$/ {f=1; next} f && /^## / {exit} f && NF' "$CHANGELOG")
          if [ -z "$body" ]; then
            echo "::error file=$CHANGELOG::$CHANGELOG has no non-empty '## Unreleased' section. Put this PR's notes under that exact heading above the latest release."
            exit 1
          fi
          echo "Changelog entry found."

  smoke:
    name: Container smoke (build → readiness → shutdown)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read   # pulls the previous release image (public; harmless)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags, to find the previous release
          fetch-tags: true
      - name: Pick the previous release to upgrade from
        run: |
          set -euo pipefail
          # The upgrade fixture is written by this release. It must be the newest
          # release whose migration set differs from HEAD's, so the boot below has
          # a real pending migration. On a PR, HEAD is the merge ref, which is the
          # tree we want to compare against.
          mig=backend/migrations/versions/
          tags=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -20 || true)
          prev=""
          why=""
          # A tag whose release build failed has no GHCR image; skip it rather
          # than failing the later docker pull with an unhelpful error.
          for t in $tags; do
            if ! diff <(git ls-tree --name-only "$t" "$mig") <(git ls-tree --name-only HEAD "$mig") >/dev/null; then
              if ! docker manifest inspect "ghcr.io/amantux/homehoard:${t#v}" >/dev/null 2>&1; then
                echo "skip $t: no published image"
                continue
              fi
              prev=$t
              why="its migrations listing differs from HEAD"
              break
            fi
          done
          if [ -z "$prev" ]; then
            for t in $tags; do
              if ! docker manifest inspect "ghcr.io/amantux/homehoard:${t#v}" >/dev/null 2>&1; then
                echo "skip $t: no published image"
                continue
              fi
              prev=$t
              why="the newest release with a published image (no migration change in the last 20 releases)"
              break
            done
          fi
          if [ -z "$prev" ]; then
            echo "::error::No vX.Y.Z release tag with a published GHCR image found; cannot pick a previous release for the upgrade smoke test."
            exit 1
          fi
          echo "::notice::Upgrading from $prev: $why."
          echo "Migrations listing, $prev (<) vs HEAD (>):"
          diff <(git ls-tree --name-only "$prev" "$mig") <(git ls-tree --name-only HEAD "$mig") || true
          echo "PREV_IMAGE=ghcr.io/amantux/homehoard:${prev#v}" >> "$GITHUB_ENV"
          # The previous release's Alembic head: the highest-numbered migration
          # file in that tag (the chain is linear, NNNN_<slug>.py).
          prev_rev=$(git ls-tree --name-only "$prev" "$mig" | sed 's#.*/##; s/\.py$//' | grep -E '^[0-9]{4}_' | sort | tail -1)
          [ -n "$prev_rev" ] || { echo "::error::could not determine the Alembic head of $prev"; exit 1; }
          echo "previous release alembic head: $prev_rev"
          echo "PREV_REV=$prev_rev" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build production image (amd64, load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: homehoard:ci
          cache-from: type=gha,scope=smoke-amd64
          cache-to: type=gha,mode=max,scope=smoke-amd64
      - name: Seed a 0018-stamped SQLite volume (upgrade-path fixture)
        run: |
          set -euo pipefail
          # Build the old DB with the REAL previous release, through its own REST
          # API, so the upgrade below runs against data that release actually
          # wrote (not a hand-rolled approximation). No fallback: if the pull
          # fails, the job fails.
          docker pull "$PREV_IMAGE"
          docker volume create hh-data
          docker run -d --name hh-prev -p 127.0.0.1:7745:7745 -v hh-data:/data \
            -e HBOX_SECRET_KEY="$(openssl rand -base64 48)" "$PREV_IMAGE"
          ok=""
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:7745/api/v1/ready >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "PREVIOUS RELEASE NEVER BECAME READY"; docker logs hh-prev; exit 1; fi
          base=http://127.0.0.1:7745/api/v1
          curl -fsS -X POST "$base/users/register" -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","name":"Smoke","password":"Smoke-upgrade-2026!"}'
          echo
          token=$(curl -fsS -X POST "$base/users/login" -H 'Content-Type: application/json' \
            -d '{"username":"smoke@example.com","password":"Smoke-upgrade-2026!"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          # A fractional quantity (NUMERIC since 0019): the upgrade must carry it through intact.
          curl -fsS -X POST "$base/items" -H "Authorization: $token" \
            -H 'Content-Type: application/json' -d '{"name":"Smoke item","quantity":2.5}'
          echo
          # Prove the fixture really is at the previous head, i.e. a pending upgrade.
          docker exec hh-prev python3 -c "
          import sqlite3
          (cur,) = sqlite3.connect('/data/homehoard.db').execute('select version_num from alembic_version').fetchone()
          print('previous release alembic', cur)
          assert cur == '$PREV_REV', cur
          "
          docker stop -t 30 hh-prev
          docker rm hh-prev
          # A pristine copy for the TERM-during-boot step (the main boot upgrades hh-data).
          docker volume create hh-data-term
          docker run --rm -v hh-data:/src -v hh-data-term:/dst --entrypoint sh homehoard:ci \
            -c 'cp -a /src/. /dst/'
      - name: Start stack and wait for READINESS (not just process start)
        run: |
          set -euo pipefail
          docker run -d --name hh-ci -p 7745:7745 -v hh-data:/data \
            -e HBOX_SECRET_KEY="$(openssl rand -base64 48)" homehoard:ci
          ok=""
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:7745/api/v1/ready >/dev/null 2>&1; then
              echo "ready after ${i} attempt(s)"; ok=1; break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "NEVER BECAME READY"; docker logs hh-ci; exit 1; fi
      - name: Smoke tests (liveness, readiness body, MCP process, non-root)
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:7745/api/v1/status | tee smoke-status.json
          echo; curl -fsS http://127.0.0.1:7745/api/v1/ready | tee smoke-ready.json
          echo
          # Every SERVER process must be non-root (uid 1000). pid 1 is now the
          # supervising shell, which stays root on purpose so it can chown the
          # Supervisor-managed /data and forward signals — so assert on the
          # children (gunicorn, mcp_server), not on pid 1.
          # Gate on /proc/*/comm, not the cmdline: a cmdline match would also
          # match this very scanning shell (its own command text contains the
          # pattern) and report a spurious root process.
          servers=$(docker exec hh-ci sh -c 'for d in /proc/[0-9]*; do
              comm=$(cat $d/comm 2>/dev/null)
              case "$comm" in
                gunicorn) ;;
                python3) tr "\0" " " < $d/cmdline 2>/dev/null | grep -q mcp_server || continue ;;
                *) continue ;;
              esac
              awk "/^Uid:/{print \$2}" $d/status 2>/dev/null
            done' | sort -u)
          echo "server uids: $servers"
          test -n "$servers"           # something must be running
          test "$servers" = "1000"     # sort -u collapses to exactly one value
          # MCP server must be listening on 7766 inside the container.
          docker exec hh-ci python3 -c "import socket;s=socket.socket();s.settimeout(3);s.connect(('127.0.0.1',7766));print('mcp listening')"
      - name: Upgrade path (pre-upgrade snapshot, alembic at head, data intact)
        run: |
          set -euo pipefail
          docker exec hh-ci sh -c "ls -l /data/backups/pre-upgrade-${PREV_REV}-*"
          docker exec -w /app/backend hh-ci python3 -c "
          import sqlite3
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config('alembic.ini'); cfg.set_main_option('script_location', 'migrations')
          head = ScriptDirectory.from_config(cfg).get_current_head()
          c = sqlite3.connect('/data/homehoard.db')
          (cur,) = c.execute('select version_num from alembic_version').fetchone()
          (qty,) = c.execute(\"select quantity from items where name = 'Smoke item'\").fetchone()
          print('alembic current', cur, 'head', head, 'quantity', qty)
          assert cur == head, (cur, head)
          assert float(qty) == 2.5, qty
          "
      - name: Hot backup hooks (consistent copy while running, removed after)
        run: |
          set -euo pipefail
          # Same command strings the Supervisor runs (homehoard/config.yaml).
          docker exec hh-ci python3 /app/backend/backup_hook.py pre
          docker exec hh-ci python3 -c "
          import os, sqlite3
          p = '/data/backups/ha-backup.db'
          st = os.stat(p)
          assert oct(st.st_mode & 0o777) == '0o600', oct(st.st_mode)
          assert st.st_uid == os.stat('/data').st_uid, (st.st_uid, os.stat('/data').st_uid)
          c = sqlite3.connect(p)
          (ok,) = c.execute('pragma integrity_check').fetchone()
          (n,) = c.execute(\"select count(*) from items where name = 'Smoke item'\").fetchone()
          print('integrity', ok, 'smoke rows', n)
          assert ok == 'ok', ok
          assert n == 1, n
          "
          docker exec hh-ci python3 /app/backend/backup_hook.py post
          docker exec hh-ci sh -c 'test ! -e /data/backups/ha-backup.db'
          curl -fsS http://localhost:7745/api/v1/ready
      - name: MCP crash is restarted and /ready recovers
        run: |
          set -euo pipefail
          pid=$(docker exec hh-ci sh -c 'for d in /proc/[0-9]*; do
              [ "$(cat $d/comm 2>/dev/null)" = python3 ] || continue
              tr "\0" " " < $d/cmdline 2>/dev/null | grep -q mcp_server && echo ${d#/proc/}
            done' | head -n1)
          test -n "$pid"
          echo "killing MCP pid $pid"
          docker exec hh-ci sh -c "kill -KILL $pid"   # kill is a shell builtin here
          seen=""
          for i in $(seq 1 50); do
            if docker logs hh-ci 2>&1 | grep -q 'MCP server exited .*restart 1/5'; then seen=1; break; fi
            sleep 0.2
          done
          test -n "$seen" || { echo "no 'restart 1/5' log line"; exit 1; }
          ok=""
          for i in $(seq 1 30); do
            mcp=$(curl -sS http://127.0.0.1:7745/api/v1/ready \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['checks']['mcp'])" || true)
            if [ "$mcp" = ok ]; then echo "checks.mcp ok after ${i}s"; ok=1; break; fi
            sleep 1
          done
          test -n "$ok" || { echo "checks.mcp never returned to ok (last: $mcp)"; exit 1; }
      - name: Clean shutdown within grace period
        run: |
          set -euo pipefail
          docker stop -t 15 hh-ci
          rc=$(docker inspect -f '{{.State.ExitCode}}' hh-ci)
          echo "exit code: $rc"
          # gunicorn exits 0 on a graceful SIGTERM; 137 = SIGKILL after the grace
          # period (ignored SIGTERM). Fail the gate on a non-graceful shutdown.
          test "$rc" = "0"
      - name: TERM during boot exits 0 (no SIGKILL mid-migration)
        run: |
          set -euo pipefail
          # Boot on the pristine 0018 copy (a real pending migration) and stop it
          # as soon as schema init begins — after the early trap is installed, so
          # the timing is deterministic rather than a race against `docker run`.
          docker run -d --name hh-term -v hh-data-term:/data \
            -e HBOX_SECRET_KEY="$(openssl rand -base64 48)" homehoard:ci
          for i in $(seq 1 300); do
            docker logs hh-term 2>&1 | grep -q 'Initializing database schema' && break
            sleep 0.1
          done
          docker stop -t 30 hh-term
          rc=$(docker inspect -f '{{.State.ExitCode}}' hh-term)
          echo "exit code: $rc"
          # 137 = the TERM was dropped and docker SIGKILLed us after 30 s.
          test "$rc" = "0"
          if docker logs hh-term 2>&1 | grep 'stop requested during startup'; then
            :
          elif docker logs hh-term 2>&1 | grep -q 'MCP server started'; then
            echo "boot completed before the stop landed; clean exit 0 still verified"
          else
            echo "exit 0 but neither a 'stop requested' line nor a completed boot"; exit 1
          fi
      - name: Container logs (on failure)
        if: failure()
        run: |
          docker logs hh-ci || true
          docker logs hh-term || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-logs
          path: smoke-*.json
          if-no-files-found: ignore

  integration-tests:
    # The matrix key in the name stops GitHub appending every matrix value, so
    # the checks read "HA integration (latest)" / "HA integration (minimum)".
    name: HA integration (${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Runs the companion integration's service tests in a real Home Assistant
    # env. These cover the confidence-tiering guards — an ambiguous
    # name must not check the wrong item out, and the spoken clarification must
    # name where each candidate lives — which nothing in the backend suite
    # exercises.
    # Two HA versions, each from an exactly-pinned harness:
    # - latest: requirements_test.txt, bumped by Dependabot (py3.14: the current
    #   harness declares Requires-Python >=3.14).
    # - minimum: requirements_test_min.txt, the HA that hacs.json declares as our
    #   floor (2024.11.0; its harness requires py3.12). Without this leg a
    #   change that only works on new HA ships to users hacs.json still admits.
    strategy:
      fail-fast: false   # a minimum-HA break must not hide the latest result
      matrix:
        include:
          - ha: latest
            python: "3.14"
            requirements: requirements_test.txt
          - ha: minimum
            python: "3.12"
            requirements: requirements_test_min.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install harness
        # Into a dedicated venv, never the runner's interpreter: the harness pins
        # an older dependency set (pydantic 1.x) that breaks `mcp` and stops the
        # backend suite collecting. This job already runs on its own VM, so today
        # the venv is belt-and-braces — it is here so that a future "merge the
        # test jobs" change cannot silently poison the backend interpreter.
        run: |
          python -m venv .venv-ha
          .venv-ha/bin/python -m pip install --upgrade pip
          .venv-ha/bin/python -m pip install -r custom_components/homehoard/tests/${{ matrix.requirements }}
      - name: Check minimum leg runs the declared minimum HA
        # requirements_test_min.txt is excluded from Dependabot; this catches it
        # drifting (a manual bump, or the exclusion not holding) from hacs.json.
        if: matrix.ha == 'minimum'
        run: |
          .venv-ha/bin/python - <<'EOF'
          import json
          from homeassistant.const import __version__ as installed
          declared = json.load(open("hacs.json"))["homeassistant"]
          assert installed == declared, f"minimum leg runs HA {installed}, hacs.json declares {declared}"
          print(f"minimum leg: HA {installed} == hacs.json")
          EOF
      - name: Run integration tests
        # asyncio_mode=auto: the async test fns have no per-test marker. sys.path
        # is fixed in the tests' conftest so `custom_components.homehoard` imports.
        run: .venv-ha/bin/python -m pytest custom_components/homehoard/tests -q -o asyncio_mode=auto

  postgres-schema:
    # Boot-migrate against a REAL Postgres. The backend suite runs on SQLite,
    # which accepts schema Postgres rejects (a Boolean default of integer 0
    # broke every fresh Postgres install), so only this job catches that class.
    name: Postgres schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea # 16-alpine
        env:
          POSTGRES_USER: homehoard
          POSTGRES_PASSWORD: homehoard  # throwaway CI-only database
          POSTGRES_DB: homehoard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homehoard -d homehoard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each test needs its own EMPTY database: both seed rows and run migrations.
      HBOX_TEST_PG_URL: postgresql://homehoard:homehoard@localhost:5432/homehoard
      HH_TEST_PG_URL: postgresql://homehoard:homehoard@localhost:5432/hh_roundtrip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"  # match the runtime image (Dockerfile: python:3.14-slim)
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Create second database
        run: python -c "import psycopg; psycopg.connect('postgresql://homehoard:homehoard@localhost:5432/homehoard', autocommit=True).execute('CREATE DATABASE hh_roundtrip')"
      - name: Run Postgres boot-migrate tests
        working-directory: backend
        run: |
          set -o pipefail
          pytest -q tests/test_postgres_schema.py tests/test_migrations.py -k postgres -rs | tee pg.log
          # A skip here means the env var vanished and nothing was tested: fail, don't go green.
          ! grep -q " skipped" pg.log

  # Auto-bump the patch version on every push to main (skips its own commit).
  bump-version:
    name: Auto-bump patch version
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the version-bump commit
    if: >
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    needs: [backend-tests, frontend-build, validate-addon, lint, smoke, integration-tests, postgres-schema]
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bump_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Bump patch version in config.yaml + manifest.json + CHANGELOG.md
        id: bump
        run: |
          python3 - <<'PY'
          import json, re, os

          cfg_path = "homehoard/config.yaml"
          man_path = "custom_components/homehoard/manifest.json"

          text = open(cfg_path).read()
          m = re.search(r'^version:\s*"?([0-9]+\.[0-9]+\.[0-9]+)"?', text, re.M)
          old = m.group(1)
          parts = old.split("."); parts[-1] = str(int(parts[-1]) + 1)
          new = ".".join(parts)

          text = re.sub(r'^(version:\s*).*$', f'\\1"{new}"', text, count=1, flags=re.M)
          open(cfg_path, "w").write(text)

          man = json.load(open(man_path))
          man["version"] = new
          with open(man_path, "w") as f:
              json.dump(man, f, indent=2); f.write("\n")

          # The add-on's Changelog tab must name the shipped version (ha-validate
          # checks it). Notes a PR added under "## Unreleased" become this
          # release; with no notes, record a placeholder rather than ship a
          # version the Changelog tab has never heard of.
          cl_path = "homehoard/CHANGELOG.md"
          cl = open(cl_path, encoding="utf-8").read()
          if re.search(r'^## Unreleased[ \t]*$', cl, re.M):
              cl = re.sub(r'^## Unreleased[ \t]*$', f'## {new}', cl, count=1, flags=re.M)
          elif not re.search(rf'^## v?{re.escape(new)}\b', cl, re.M):
              cl = re.sub(r'^(# Changelog[^\n]*\n\n?)',
                          lambda m: f'{m.group(1)}## {new}\n\n- Maintenance release.\n\n',
                          cl, count=1, flags=re.M)
          open(cl_path, "w", encoding="utf-8").write(cl)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"old_version={old}\nnew_version={new}\n")
          print(f"Bumped {old} -> {new}")
          PY
      - name: Commit version bump
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add homehoard/config.yaml custom_components/homehoard/manifest.json homehoard/CHANGELOG.md
          git commit -m "chore: bump version ${{ steps.bump.outputs.old_version }} → ${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:${{ github.ref_name }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Build each architecture on a NATIVE runner (no QEMU). QEMU-emulated arm64
  # builds of the Node+Python image were so slow they hit the 6-hour job limit
  # and got cancelled. ubuntu-24.04-arm is a free native arm64 runner for public
  # repos, so both arches build in minutes.
  docker-build:
    permissions:
      contents: read
      packages: write   # pushes per-arch images to GHCR
    name: Build & push (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    if: >
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    needs: [bump-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push per-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # Per-arch tags; merged into a multi-arch manifest by the next job.
          tags: |
            ghcr.io/amantux/homehoard:${{ needs.bump-version.outputs.new_version }}-${{ matrix.arch }}
            ghcr.io/amantux/homehoard:latest-${{ matrix.arch }}
          # Scope per arch so amd64 and arm64 layers never share a cache.
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

  merge-manifest:
    permissions:
      contents: read
      packages: write   # pushes the multi-arch manifest to GHCR
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    needs: [bump-version, docker-build]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifests
        run: |
          V=${{ needs.bump-version.outputs.new_version }}
          docker buildx imagetools create \
            --tag ghcr.io/amantux/homehoard:${V} \
            --tag ghcr.io/amantux/homehoard:latest \
            ghcr.io/amantux/homehoard:${V}-amd64 \
            ghcr.io/amantux/homehoard:${V}-arm64
          echo "Published ghcr.io/amantux/homehoard:${V} (amd64 + arm64)"

  # Cut a GitHub Release/tag per version so HACS surfaces clean update prompts.
  # Tags the bump commit (whose manifest.json already holds the new version) and
  # only runs once the image is published, so a release always has a matching
  # ghcr image + integration source.
  release:
    permissions:
      contents: write   # creates the GitHub release
    name: GitHub release (HACS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    needs: [bump-version, merge-manifest]
    steps:
      - name: Create release v${{ needs.bump-version.outputs.new_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.bump-version.outputs.new_version }}
          SHA: ${{ needs.bump-version.outputs.bump_sha }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "v${V}" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release v${V} already exists — skipping."
          else
            gh release create "v${V}" \
              --repo "$REPO" \
              --target "$SHA" \
              --title "v${V}" \
              --notes "HomeHoard ${V} — Home Assistant add-on & HACS integration. Container image: ghcr.io/amantux/homehoard:${V}"
            echo "Created release v${V} at ${SHA}"
          fi
