name: HomeHoard
version: "1.0.43"
slug: homehoard
description: Home inventory & organization — a personal rewrite of homebox with QR/barcode and Home Assistant support
url: https://github.com/Amantux/homehoard
# Pull the multi-arch image published by CI instead of building on-device.
image: ghcr.io/amantux/homehoard
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 7745
panel_icon: mdi:package-variant-closed
panel_title: HomeHoard
# Advertise to Home Assistant so the companion integration auto-discovers us.
discovery:
  - homehoard
# NOTE: the MCP server (SSE :7766) is intentionally NOT published to the host.
# Everything reaches HomeHoard inside Home Assistant's boundary: the UI/API via
# Ingress (port 7745, authenticated by HA), and the MCP server only over the
# internal Supervisor network — Home Assistant's MCP Client connects to it by
# the add-on's container hostname (http://<slug>-homehoard:7766/sse), so 7766 is
# never exposed on the host/LAN.
map:
  - share:rw
# hassio_api + the manager role let the app read the Supervisor add-on list and
# discovery messages, so it can find the Shared PostgreSQL add-on to auto-provision.
hassio_api: true
hassio_role: manager
options:
  disable_auth: true
  allow_registration: false
  enable_mcp: true
  ollama_search_key: ""
  barcode_lookup: false
  barcode_db_key: ""
  database_url: ""
  migrate_from_sqlite: false
  use_shared_postgres: false
  postgres_provision_token: ""
schema:
  disable_auth: bool
  allow_registration: bool
  enable_mcp: bool
  # Optional: an Ollama API key (ollama.com) to look items up online and generate
  # a short searchable description. Blank = the feature is off.
  ollama_search_key: password?
  # Identify an unknown scanned product barcode (UPC/EAN) online — product DB →
  # Open Food Facts → Ollama web-search — to prefill a new item's name/brand.
  # Off = scans still resolve your own tags/items, just no online product lookup.
  barcode_lookup: bool
  # Optional API key for the product-barcode DB. The default lookup endpoint is
  # keyless; set this only if you've pointed the lookup at a keyed provider.
  barcode_db_key: password?
  # Optional external Postgres. Blank = built-in SQLite in /data (or the shared
  # add-on below). Format: postgresql+psycopg://user:pass@host:5432/homehoard
  database_url: password?
  # One-shot: when moving to Postgres (via database_url OR use_shared_postgres)
  # with existing data in the built-in SQLite, turn this on and restart once to
  # copy that data into the (empty) Postgres, then leave it on (no-op once the
  # target has data). Without it, switching to Postgres serves an EMPTY database.
  migrate_from_sqlite: bool
  # Auto-provision a private database on the "Shared PostgreSQL" add-on so all
  # your apps share one Postgres server (each keeps its own database). Requires
  # that add-on installed. Ignored if database_url is set. If you already have
  # data in the built-in SQLite, also enable migrate_from_sqlite to carry it over.
  use_shared_postgres: bool
  # Provisioning token for the Shared PostgreSQL add-on. Leave blank to
  # auto-obtain it from the add-on (recommended); set it only if auto-discovery
  # can't reach the add-on's token.
  postgres_provision_token: password?
